<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud IAM Console - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card bg-secondary text-white p-4 shadow">
                    <h3 class="text-center mb-4">AWS Management Console (Simulator)</h3>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">IAM Username</label>
                            <input type="text" name="username" class="form-control bg-dark text-white border-0" placeholder="e.g. developer" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control bg-dark text-white border-0" required>
                        </div>
                        <button type="submit" class="w-100 btn btn-warning">Sign In</button>
                    </form>
                    <div class="mt-3 text-muted text-center small">
                        Hint: Default developer user is <code>developer</code> / <code>devpassword123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

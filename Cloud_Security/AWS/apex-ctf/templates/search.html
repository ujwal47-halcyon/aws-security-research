<!DOCTYPE html>
<html>
<head>
    <title>Search Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <h2>Internal Log Search</h2>
    <form method="GET" class="my-4">
        <div class="input-group">
            <input type="text" name="q" class="form-control" placeholder="Search query..." value="{{ q }}">
            <button class="btn btn-primary">Search</button>
        </div>
    </form>

    {% if q %}
        <div class="alert alert-info">
            <!-- VULNERABILITY: Renders the unsanitized q query parameters (REFLECTED XSS) -->
            <h4>Raw Search Query Render:</h4>
            <p>You searched for: {{ q|safe }}</p>
        </div>

        <div class="alert alert-warning">
            <h4>"Sanitized" Output (Attempts to strip &lt;script&gt; tags recursively):</h4>
            <p>Processed Search: {{ sanitized_q|safe }}</p>
        </div>
    {% endif %}
</body>
</html>

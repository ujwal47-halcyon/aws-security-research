<!DOCTYPE html>
<html>
<head>
    <title>Transfer Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5" style="max-width: 600px;">
    <h2>Secure Transfer Gateway</h2>
    <p>Your Balance: <strong>${{ balance }}</strong></p>
    <hr>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Beneficiary Username</label>
            <input type="text" name="to_user" class="form-control" placeholder="e.g. admin" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Amount ($)</label>
            <input type="number" name="amount" class="form-control" min="1" max="1000" required>
        </div>
        <button type="submit" class="btn btn-danger w-100">Send Funds</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Invoice Summary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <div class="card p-5 shadow">
        <h2>Apex Corp Invoice: #{{ invoice.id }}</h2>
        <hr>
        <p><strong>Owner ID:</strong> {{ invoice.user_id }}</p>
        <p><strong>Billing Amount:</strong> ${{ invoice.amount }}</p>
        <p><strong>Itemization:</strong> {{ invoice.description }}</p>
        <p><strong>Status:</strong> <span class="badge bg-danger">{{ invoice.status }}</span></p>
    </div>
</body>
</html>

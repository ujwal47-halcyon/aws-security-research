<!DOCTYPE html>
<html>
<head>
    <title>Apex Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2>Welcome, {{ username }} (Role: {{ role }})</h2>
        <a href="/scoring" class="btn btn-warning">View Flags Dashboard</a>
    </div>
    <div class="row">
        <div class="col-md-4">
            <div class="card p-3 mb-3 text-center">
                <h4>Support Services</h4>
                <a href="/support" class="btn btn-primary mt-2">Open Ticket</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 mb-3 text-center">
                <h4>Financial Actions</h4>
                <a href="/transfer" class="btn btn-danger mt-2">Transfer Funds</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 mb-3 text-center">
                <h4>System Query</h4>
                <a href="/search" class="btn btn-secondary mt-2">Search Logs</a>
            </div>
        </div>
    </div>
</body>
</html>

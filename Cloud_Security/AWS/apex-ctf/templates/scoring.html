<!DOCTYPE html>
<html>
<head>
    <title>Apex Scoring Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <h2 class="text-center text-success mb-4">🏆 APEX SECURITY CHALLENGE LEADERBOARD</h2>

    {% if message %}
        <div class="alert alert-info text-center">{{ message }}</div>
    {% endif %}

    <div class="row">
        <div class="col-md-6">
            <div class="card p-4">
                <h4>Submit Flag</h4>
                <form method="POST">
                    <div class="input-group">
                        <input type="text" name="flag" class="form-control" placeholder="FLAG{...}" required>
                        <button type="submit" class="btn btn-success">Submit</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4">
                <h4>Earned Badges & Solves</h4>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Flag</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for f in flags %}
                            <tr>
                                <td><code>{{ f.flag }}</code></td>
                                <td><span class="badge bg-success">100 Points</span></td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>

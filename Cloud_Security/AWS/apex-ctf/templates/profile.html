<!DOCTYPE html>
<html>
<head>
    <title>User Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <h2>Public Profile of {{ user.username }}</h2>
    <div class="card p-4">
        <p><strong>User Email:</strong> {{ user.email }}</p>
        <p><strong>Affiliated Node:</strong> apex-node-east</p>

        <!-- VULNERABILITY: Statement Token Leaked in Hidden/Developer Profile Data -->
        {% if leak %}
            <script>
                console.log("[DEBUG] Private UUID transaction link matches statement key: {{ leak }}");
            </script>
        {% endif %}
    </div>
</body>
</html>

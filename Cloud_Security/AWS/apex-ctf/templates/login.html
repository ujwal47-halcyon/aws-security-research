<!DOCTYPE html>
<html>
<head>
    <title>Apex Portal Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5" style="max-width: 500px;">
    <h2 class="text-center mb-4">Apex Secure Gateway</h2>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3 p-3 bg-light border text-center">
            <strong>CAPTCHA Validation</strong><br>
            <span class="badge bg-dark fs-4 mb-2">{{ captcha }}</span>
            <input type="text" name="captcha" class="form-control mt-2" placeholder="Enter characters above" required>
        </div>
        <button type="submit" class="btn btn-danger w-100">Authenticate</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Apex Support</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <h2>Secure Support Portal</h2>
    {% if success %}
        <div class="alert alert-success">{{ success }}</div>
    {% endif %}
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" name="subject" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Detailed Message</label>
            <textarea name="message" class="form-control" rows="5" placeholder="Include logs, HTML outputs, or script references here..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Ticket</button>
    </form>
</body>
</html>
